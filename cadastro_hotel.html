<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Hotel</title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        input {
            padding: 8px;
            margin: 5px;
        }
        form {
            text-align: center;
        }
        button {
            background-color: #4caf50;
            color: white;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: purple;">Velvet hotel</h1>
    <h2>Cadastro de Hotel</h2>

    <form action="salvar_hotel.php" method="POST">
        
        <label>Nome do Hotel:</label>
        <input type="text" name="nome" required>
        <br><br>

        <label>Cidade:</label>
        <input type="text" name="cidade" required>
        <br><br>

        <label>Classificação em Estrelas:</label>
        <input type="number" name="estrelas" min="1" max="5" required>
        <br><br>
        <label> E-mail de acesso</label>
        <input type="email" name="email" required>
        <br> <br>
        <label>Senha</label>
        <input type="password" name="senha" required>
        <br><br>

        <button type="submit">Enviar</button>
    </form>

    <br>
    <a href="index.html">Voltar à página principal</a>

</body>
</html>
